<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 264" width="900" height="264" role="img" aria-label="Banuja Kaushalya Hero Banner">
  <defs>
    
    <linearGradient id="hero-light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hero-light-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0"/>
      <stop offset="35%" stop-color="#4f46e5" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#0891b2" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-light-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="58%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  
    <pattern id="hero-light-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.05" fill="#cbd5e1"/>
    </pattern>
    <radialGradient id="hero-light-mask-grad" cx="70%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="hero-light-dots-mask">
      <rect width="900" height="264" fill="url(#hero-light-mask-grad)"/>
    </mask>
    <filter id="hero-light-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <clipPath id="hero-light-clip">
      <rect x="0.5" y="0.5" width="899" height="263" rx="18"/>
    </clipPath>
    <style>
      @keyframes floatA {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-14px, 10px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(12px, -10px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.85); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.15; }
      }
      @keyframes ticker1 {
        0%, 28% { opacity: 1; }
        33%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes ticker2 {
        0%, 30% { opacity: 0; }
        35%, 61% { opacity: 1; }
        66%, 100% { opacity: 0; }
      }
      @keyframes ticker3 {
        0%, 63% { opacity: 0; }
        68%, 94% { opacity: 1; }
        99%, 100% { opacity: 0; }
      }
      .orb-a { animation: floatA 11s ease-in-out infinite; }
      .orb-b { animation: floatB 14s ease-in-out infinite; }
      .status-dot { transform-box: fill-box; transform-origin: center; animation: pulseDot 2.4s ease-in-out infinite; }
      .cursor-blink { animation: blinkCursor 1.1s step-end infinite; }
      .t-line-1 { animation: ticker1 12s ease-in-out infinite; }
      .t-line-2 { animation: ticker2 12s ease-in-out infinite; }
      .t-line-3 { animation: ticker3 12s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#hero-light-clip)">
    <rect width="900" height="264" fill="url(#hero-light-bg)"/>
    <rect width="900" height="264" fill="url(#hero-light-dots)" mask="url(#hero-light-dots-mask)"/>

    <circle class="orb-a" cx="760" cy="52" r="135" fill="#4f46e5" opacity="0.14" filter="url(#hero-light-blur)"/>
    <circle class="orb-b" cx="150" cy="238" r="115" fill="#0891b2" opacity="0.14" filter="url(#hero-light-blur)"/>

    <!-- Geometric Constellation Motif -->
    <g transform="translate(650, 38)" opacity="0.88">
      <rect x="0" y="0" width="210" height="188" rx="14" fill="#f8fafc" fill-opacity="0.55" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="105" cy="94" r="68" fill="none" stroke="rgba(79,70,229,0.28)" stroke-width="1" stroke-dasharray="4 4"/>
      <circle cx="105" cy="94" r="44" fill="none" stroke="rgba(8,145,178,0.28)" stroke-width="1"/>
      <circle cx="105" cy="94" r="20" fill="rgba(79,70,229,0.09)" stroke="#4f46e5" stroke-width="1.2"/>
      <path d="M52 54 L105 94 L162 60 M105 94 L152 138 M105 94 L60 134" stroke="#cbd5e1" stroke-width="1.15" fill="none"/>
      <circle cx="52" cy="54" r="4.5" fill="#0891b2"/>
      <circle cx="162" cy="60" r="4.5" fill="#7c3aed"/>
      <circle cx="152" cy="138" r="4.5" fill="#059669"/>
      <circle cx="60" cy="134" r="4.5" fill="#4f46e5"/>
      <circle cx="105" cy="94" r="5.5" fill="#0f172a" stroke="#4f46e5" stroke-width="2"/>
      <text x="16" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#64748b" letter-spacing="0.08em">SYS // ARCHITECT</text>
      <text x="16" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#0e7490">DB → API → AI → UI</text>
    </g>

    <!-- Status Pill -->
    <g transform="translate(44, 34)">
      <rect x="0" y="0" width="332" height="26" rx="13" fill="rgba(5,150,105,0.09)" stroke="rgba(5,150,105,0.28)" stroke-width="1"/>
      <circle class="status-dot" cx="15" cy="13" r="3.6" fill="#059669"/>
      <text x="27" y="16.8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10.2" font-weight="600" letter-spacing="0.06em" fill="#047857">SHIPPING POS SAAS · OPEN TO AMBITIOUS PROJECTS</text>
    </g>

    <!-- Main Identity -->
    <text x="44" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.03em" fill="url(#hero-light-brand)">Banuja Kaushalya</text>
    <text x="44" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">Full-Stack Engineer crafting scalable web apps,</text>
    <text x="44" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569">SaaS products &amp; AI-powered experiences.</text>

    <!-- Animated Terminal Ticker -->
    <g transform="translate(44, 190)">
      <rect x="0" y="0" width="582" height="38" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#0891b2">&gt;</text>
      <rect class="cursor-blink" x="26" y="13" width="7" height="13" rx="1.5" fill="#4f46e5"/>
      <text class="t-line-1" x="42" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.8" fill="#0f172a">Building POS System SaaS — dynamic modules, pricing &amp; cloud ops</text>
      <text class="t-line-2" x="42" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.8" fill="#0f172a" opacity="0">Exploring AI/ML integration — vision &amp; from-scratch neural nets</text>
      <text class="t-line-3" x="42" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.8" fill="#0f172a" opacity="0">Deep-diving into DevOps, clean architecture &amp; AWS cloud infra</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="263" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="20" y1="1.25" x2="880" y2="1.25" stroke="url(#hero-light-sheen)" stroke-width="1.2"/>
</svg>
